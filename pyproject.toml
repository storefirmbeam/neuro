[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "neuro-terminal"
version = "0.1.0"
description = "A terminal-native AI assistant with tool support"
readme = "README.md"
requires-python = ">=3.10"

dependencies = [
    "openai>=2.45.0",
    "python-dotenv>=1.0.0",
    "prompt-toolkit>=3.0.0",
    "requests>=2.0.0",
    "rich>=13.0.0",
]

[project.scripts]
neuro = "main:main"

[tool.setuptools]
py-modules = ["main"]

[tool.setuptools.packages.find]
where = ["."]
include = ["src", "src.*"]